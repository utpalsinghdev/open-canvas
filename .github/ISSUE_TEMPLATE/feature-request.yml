name: Feature request
description: Propose a complete workflow or improvement for Open Cavas.
title: "[Feature Request] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search existing open and closed issues first. Explain the task you need to complete and the result you expect. Keep private designs and planning documents out of this public report.
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing requests
      options:
        - label: I searched existing issues for this request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult today?
      description: Describe who needs this and where the current workflow falls short. Distinguish observed behavior from assumptions.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Requested workflow
      description: Describe the starting state, actions, and result. Include where the feature belongs in the editor or MCP workflow when relevant.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: What would make this complete?
      description: Give observable acceptance criteria. Consider manual editing, MCP, undo, saving/reopening, native backups, or rendered exports where affected. Separate essentials from later ideas.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What have you tried or considered, and why is it insufficient?
  - type: textarea
    id: context
    attributes:
      label: Examples and context
      description: Add related issues or sanitized examples. Explain which behavior matters rather than requesting an entire reference product.
  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to contribute?
      options:
        - I am proposing the idea only
        - I can help validate the workflow
        - I would like to implement it after scope is agreed
